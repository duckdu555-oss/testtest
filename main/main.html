<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>메인</title>

  <style>
    @font-face {
      font-family: 'Jalnan';
      src: url('https://cdn.jsdelivr.net/gh/webfontworld/goodchoice/Jalnan.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      background: #fff;
      font-family: 'Jalnan', Arial, sans-serif;
      color: #111;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
    }

    .top-logo-wrap {
      width: 100%;
      height: 85px;
      min-height: 85px;
      padding: 14px 14px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      overflow: visible;
      position: relative;
      z-index: 5;
    }

    .top-logo-wrap img {
      max-width: 330px;
      max-height: 64px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      transform: scale(1.35);
      transform-origin: center center;
    }

    .logo-fallback {
      min-width: 210px;
      height: 54px;
      border-radius: 12px;
      border: 1px dashed #c7c7c7;
      color: #777;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      background: #fafafa;
    }

    .member-bar {
      width: 100%;
      min-height: 42px;
      padding: 7px 8px;
      border-bottom: 1px solid #d9d9d9;
      background: linear-gradient(180deg, #ffffff 0%, #f5f5f5 100%);
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      font-family: Arial, sans-serif;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: -0.45px;
    }

    .level-badge {
      flex: 0 0 auto;
      padding: 5px 6px;
      border-radius: 6px;
      background: #ececec;
      border: 1px solid #cfcfcf;
      color: #222;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
      margin-right: 5px;
    }

    .nickname {
      flex: 0 0 auto;
      max-width: 72px;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #111;
      margin-right: 32px;
    }

    .money-item {
      flex: 0 0 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #333;
    }

    .money-item + .money-item {
      margin-left: 32px;
    }

    .money-item .amount {
      color: #004fd6;
    }

    .point-click {
      cursor: pointer;
      text-decoration: none;
    }

    .refresh-btn {
      flex: 0 0 auto;
      margin-left: auto;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 0;
      background: transparent;
      color: #222;
      font-size: 15px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      box-shadow: none;
      padding: 0;
    }

    .section-line {
      width: 100%;
      height: 8px;
      background: #f2f2f2;
      border-bottom: 1px solid #dedede;
    }

    .banner-wrap {
      width: 100%;
      background: #fff;
      padding: 10px 10px 8px;
      overflow: hidden;
    }

    .banner-viewport {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #eeeeee;
      border: 1px solid #e1e1e1;
      position: relative;
      touch-action: pan-y;
    }

    .banner-track {
      display: flex;
      width: 100%;
      transition: transform 0.32s ease;
      will-change: transform;
    }

    .banner-slide {
      min-width: 100%;
      height: 126px;
      background: linear-gradient(180deg, #f7f7f7, #e9e9e9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 15px;
      overflow: hidden;
    }

    .banner-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .banner-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 14px;
    }

    .banner-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding-top: 7px;
    }

    .banner-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #c9c9c9;
      border: none;
      padding: 0;
    }

    .banner-dot.active {
      background: #222;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.48);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .convert-modal {
      width: 100%;
      max-width: 310px;
      background: #fff;
      border-radius: 14px;
      padding: 20px 16px 16px;
      text-align: center;
      box-shadow: 0 12px 28px rgba(0,0,0,0.28);
      border: 1px solid rgba(0,0,0,0.08);
    }

    .convert-title {
      font-size: 15px;
      margin-bottom: 8px;
      color: #111;
    }

    .convert-desc {
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #444;
      line-height: 1.45;
      margin-bottom: 15px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
    }

    .modal-actions button {
      flex: 1;
      height: 40px;
      border-radius: 8px;
      border: 1px solid #cfcfcf;
      font-family: 'Jalnan', Arial, sans-serif;
      font-size: 13px;
      cursor: pointer;
    }

    .cancel-btn {
      background: #eeeeee;
      color: #222;
    }

    .confirm-btn {
      background: #2e8bef;
      color: #fff;
      border-color: #1e68b8 !important;
    }
  .logo img,#logo{width:190px !important;height:56px !important;object-fit:fill !important;}
</style>

  <script>
    (function () {
      const LOGIN_SESSION_KEY = "currentLoginMember";
      const MEMBERS_KEY = "signupMembers";
      let session = null;
      let members = [];

      try {
        session = JSON.parse(localStorage.getItem(LOGIN_SESSION_KEY) || "null");
        members = JSON.parse(localStorage.getItem(MEMBERS_KEY) || "[]");
      } catch (e) {
        session = null;
        members = [];
      }

      const approvedMember = members.find(function(member) {
        return String(member.userId || "") === String(session && session.userId || "")
          && member.status === "approved";
      });

      if (!session || session.status !== "approved" || !session.userId || !approvedMember) {
        localStorage.removeItem(LOGIN_SESSION_KEY);
        alert("로그인 후 이용 가능합니다.");
        location.replace("../login/login.html");
      }
    })();
  </script>
</head>

<body>
  <div class="page">
    <header class="top-logo-wrap" id="homeLogoRefresh">
      <img src="../image/homelogo.png" alt="홈 로고" id="homeLogo">
      <div class="logo-fallback" id="logoFallback">homelogo.png</div>
    </header>

    <div class="member-bar">
      <div class="level-badge" id="levelText">LV.1</div>
      <div class="nickname" id="nicknameText">닉네임</div>
      <div class="money-item">보유머니 <span class="amount" id="balanceText">0</span></div>
      <div class="money-item">포인트 <span class="amount point-click" id="pointText">0</span></div>
      <button type="button" class="refresh-btn" id="refreshBtn" aria-label="새로고침">↻</button>
    </div>

    <div class="section-line"></div>

    <section class="banner-wrap">
      <div class="banner-viewport" id="bannerViewport">
        <div class="banner-track" id="bannerTrack">
          <div class="banner-slide"><img src="../image/banner1.png" alt="배너1"></div>
          <div class="banner-slide"><img src="../image/banner2.png" alt="배너2"></div>
          <div class="banner-slide"><img src="../image/banner3.png" alt="배너3"></div>
          <div class="banner-slide"><img src="../image/banner4.png" alt="배너4"></div>
        </div>
      </div>
      <div class="banner-dots" id="bannerDots" aria-label="배너 페이지 표시"></div>
    </section>

    <div class="section-line"></div>
  </div>

  <div class="modal-backdrop" id="convertModal">
    <div class="convert-modal">
      <div class="convert-title">포인트 전환</div>
      <div class="convert-desc" id="convertDesc">포인트를 보유머니로 전환하시겠습니까?</div>
      <div class="modal-actions">
        <button type="button" class="cancel-btn" id="cancelConvert">취소</button>
        <button type="button" class="confirm-btn" id="confirmConvert">확인</button>
      </div>
    </div>
  </div>

  <script>
    const LOGIN_SESSION_KEY = "currentLoginMember";
    const MEMBERS_KEY = "signupMembers";

    const levelText = document.getElementById("levelText");
    const nicknameText = document.getElementById("nicknameText");
    const balanceText = document.getElementById("balanceText");
    const pointText = document.getElementById("pointText");
    const refreshBtn = document.getElementById("refreshBtn");
    const convertModal = document.getElementById("convertModal");
    const convertDesc = document.getElementById("convertDesc");
    const cancelConvert = document.getElementById("cancelConvert");
    const confirmConvert = document.getElementById("confirmConvert");
    const homeLogoRefresh = document.getElementById("homeLogoRefresh");
    const homeLogo = document.getElementById("homeLogo");
    const logoFallback = document.getElementById("logoFallback");

    let currentMemberIndex = -1;
    let currentMember = null;

    function toNumber(value) {
      const number = Number(String(value || "0").replace(/[^0-9.-]/g, ""));
      return Number.isFinite(number) ? number : 0;
    }

    function formatMoney(value) {
      return toNumber(value).toLocaleString("ko-KR");
    }

    function loadMembers() {
      try {
        return JSON.parse(localStorage.getItem(MEMBERS_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveMembers(members) {
      localStorage.setItem(MEMBERS_KEY, JSON.stringify(members));
    }

    function loadSession() {
      try {
        return JSON.parse(localStorage.getItem(LOGIN_SESSION_KEY) || "null");
      } catch (e) {
        return null;
      }
    }

    function syncMemberInfo() {
      const session = loadSession();
      const members = loadMembers();
      currentMemberIndex = members.findIndex(function(member) {
        return String(member.userId || "") === String(session && session.userId || "")
          && member.status === "approved";
      });

      if (currentMemberIndex < 0) {
        localStorage.removeItem(LOGIN_SESSION_KEY);
        alert("로그인 후 이용 가능합니다.");
        location.replace("../login/login.html");
        return;
      }

      currentMember = members[currentMemberIndex];

      if (!currentMember.level) currentMember.level = "1";
      if (currentMember.balance === undefined) currentMember.balance = 0;
      if (currentMember.point === undefined) currentMember.point = 0;

      const displayNickname = (
        currentMember.nickname ||
        currentMember.nickName ||
        currentMember.userNickname ||
        currentMember.name ||
        (session && (session.nickname || session.nickName || session.userNickname)) ||
        currentMember.userId ||
        "닉네임"
      );

      const nextSession = Object.assign({}, session || {}, {
        userId: currentMember.userId,
        nickname: displayNickname,
        status: "approved"
      });

      saveMembers(members);
      localStorage.setItem(LOGIN_SESSION_KEY, JSON.stringify(nextSession));

      levelText.textContent = "LV." + currentMember.level;
      nicknameText.textContent = displayNickname;
      balanceText.textContent = formatMoney(currentMember.balance);
      pointText.textContent = formatMoney(currentMember.point);
    }

    pointText.addEventListener("click", function() {
      syncMemberInfo();
      const point = toNumber(currentMember && currentMember.point);
      convertDesc.textContent = point > 0
        ? "포인트 " + formatMoney(point) + "원을 보유머니로 전환하시겠습니까?"
        : "전환할 포인트가 없습니다.";
      convertModal.classList.add("active");
    });

    cancelConvert.addEventListener("click", function() {
      convertModal.classList.remove("active");
    });

    convertModal.addEventListener("click", function(e) {
      if (e.target === convertModal) {
        convertModal.classList.remove("active");
      }
    });

    confirmConvert.addEventListener("click", function() {
      const members = loadMembers();
      if (currentMemberIndex < 0 || !members[currentMemberIndex]) {
        syncMemberInfo();
        return;
      }

      const point = toNumber(members[currentMemberIndex].point);
      if (point <= 0) {
        convertModal.classList.remove("active");
        return;
      }

      members[currentMemberIndex].balance = toNumber(members[currentMemberIndex].balance) + point;
      members[currentMemberIndex].point = 0;
      saveMembers(members);
      convertModal.classList.remove("active");
      syncMemberInfo();
      alert("포인트가 보유머니로 전환되었습니다.");
    });

    refreshBtn.addEventListener("click", syncMemberInfo);
    homeLogoRefresh.addEventListener("click", function() {
      location.reload();
    });

    homeLogo.addEventListener("error", function() {
      homeLogo.style.display = "none";
      logoFallback.style.display = "flex";
    });

    document.querySelectorAll(".banner-slide img").forEach(function(img, index) {
      img.addEventListener("error", function() {
        const parent = img.parentElement;
        parent.innerHTML = '<div class="banner-fallback">banner' + (index + 1) + '.png</div>';
      });
    });

    const bannerTrack = document.getElementById("bannerTrack");
    const bannerViewport = document.getElementById("bannerViewport");
    const bannerDots = document.getElementById("bannerDots");
    const totalSlides = 4;
    let currentSlide = 0;
    let autoTimer = null;
    let startX = 0;
    let currentX = 0;
    let isDragging = false;

    function renderDots() {
      bannerDots.innerHTML = "";
      for (let i = 0; i < totalSlides; i++) {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "banner-dot" + (i === currentSlide ? " active" : "");
        dot.addEventListener("click", function() {
          goToSlide(i);
          restartAuto();
        });
        bannerDots.appendChild(dot);
      }
    }

    function goToSlide(index) {
      currentSlide = (index + totalSlides) % totalSlides;
      bannerTrack.style.transition = "transform 0.32s ease";
      bannerTrack.style.transform = "translateX(-" + (currentSlide * 100) + "%)";
      renderDots();
    }

    function nextSlide() {
      goToSlide(currentSlide + 1);
    }

    function restartAuto() {
      if (autoTimer) clearInterval(autoTimer);
      autoTimer = setInterval(nextSlide, 5000);
    }

    bannerViewport.addEventListener("touchstart", function(e) {
      if (!e.touches || !e.touches.length) return;
      isDragging = true;
      startX = e.touches[0].clientX;
      currentX = startX;
      bannerTrack.style.transition = "none";
      if (autoTimer) clearInterval(autoTimer);
    }, { passive: true });

    bannerViewport.addEventListener("touchmove", function(e) {
      if (!isDragging || !e.touches || !e.touches.length) return;
      currentX = e.touches[0].clientX;
      const diff = currentX - startX;
      const width = bannerViewport.clientWidth || 1;
      const base = -currentSlide * width;
      bannerTrack.style.transform = "translateX(" + (base + diff) + "px)";
    }, { passive: true });

    bannerViewport.addEventListener("touchend", function() {
      if (!isDragging) return;
      isDragging = false;
      const diff = currentX - startX;
      const threshold = 45;
      if (diff > threshold) {
        goToSlide(currentSlide - 1);
      } else if (diff < -threshold) {
        goToSlide(currentSlide + 1);
      } else {
        goToSlide(currentSlide);
      }
      restartAuto();
    });

    syncMemberInfo();
    renderDots();
    restartAuto();
  </script>
</body>
</html>
